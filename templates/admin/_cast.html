<!-- Medien abfeuern: eine Datei sofort zeigen/casten, ohne Zone (Nutzer, 2026-10-25) -->
<section class="card" id="card-cast">
    <h2>Medien abfeuern</h2>
    <p class="hint">
        Eine Datei sofort abspielen &mdash; ohne Zone, ohne Entfernungsgrenze.
        Auf dem Schirm am Aufbau oder auf einem Chromecast im Netz. Zum
        laufenden Betrieb mit Sensor zur&uuml;ck geht es mit &bdquo;Stopp&ldquo;.
    </p>
    <div class="row" style="gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
        <select id="cast-datei" class="input" style="min-width:220px;max-width:320px;"></select>
        <button class="btn btn-small" id="btn-cast-reload-medien">Medienliste aktualisieren</button>
    </div>
    <div class="row" style="gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn" id="btn-fire-screen">Auf dem Schirm abfeuern</button>
        <button class="btn" id="btn-fire-cast">Auf dem Chromecast abfeuern</button>
        <button class="btn btn-secondary" id="btn-fire-stop">Stopp</button>
    </div>
    <h3 style="margin-top:16px;">Chromecast</h3>
    <div id="cast-list" class="media-list"></div>
    <div class="row" style="gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="cast-ip" class="input" placeholder="IP, z. B. 192.168.2.2"
               style="max-width:220px;" />
        <button class="btn btn-small" id="btn-cast-suche">Chromecasts suchen</button>
    </div>
    <div id="cast-feedback" class="feedback"></div>
</section>
