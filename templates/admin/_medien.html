<!-- Medienbibliothek -->
<section class="card" id="card-medien">
    <h2>Medienbibliothek</h2>
    <!-- Hinweise des Medien-Checks nach einem Upload (z. B. 4K, das
         auf einem Pi ruckelt). Keine Ablehnung: die Datei ist da. -->
    <div id="upload-hinweise"></div>
    <div class="tabs">
        <button class="tab active" onclick="switchTab('videos', this)">&#127916; Videos</button>
        <button class="tab" onclick="switchTab('images', this)">&#128444; Bilder</button>
        <button class="tab" onclick="switchTab('audio', this)">&#127925; Audio</button>
    </div>

    <div id="tab-videos" class="tab-content active">
        <div id="list-videos" class="media-list"></div>
        <div class="upload-area" data-type="videos">
            <input type="file" accept="video/*" multiple hidden>
            <span class="upload-text">&#128193; Videos hochladen (Klick oder Drag&amp;Drop)</span>
            <div class="progress" hidden>
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <span class="progress-text">0%</span>
            </div>
        </div>
    </div>

    <div id="tab-images" class="tab-content">
        <div id="list-images" class="media-list"></div>
        <div class="upload-area" data-type="images">
            <input type="file" accept="image/*" multiple hidden>
            <span class="upload-text">&#128193; Bilder hochladen (Klick oder Drag&amp;Drop)</span>
            <div class="progress" hidden>
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <span class="progress-text">0%</span>
            </div>
        </div>
    </div>

    <div id="tab-audio" class="tab-content">
        <div id="list-audio" class="media-list"></div>
        <div class="upload-area" data-type="audio">
            <input type="file" accept="audio/*" multiple hidden>
            <span class="upload-text">&#128193; Audio hochladen (Klick oder Drag&amp;Drop)</span>
            <div class="progress" hidden>
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <span class="progress-text">0%</span>
            </div>
        </div>
    </div>
</section>
