<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ Media Station</title>
    <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { max-width: 720px; width: 100%; padding: 40px 20px; }
        .launch-signet { display: block; height: 64px; width: auto; margin-bottom: 24px; }
        h1 { font-size: 1.6rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
        .subtitle, .ip { color: var(--text-dim); font-size: 0.95rem; }
        .ip { margin-bottom: 30px; padding-bottom: 8px; border-bottom: 1px solid var(--line-steel); }
        .ip strong { color: var(--accent); }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
        a.card, div.card { display: block; margin: 0; padding: 24px 16px; text-decoration: none; color: inherit; transition: border-color 0.35s cubic-bezier(.2,.8,.2,1); }
        a.card { cursor: pointer; }
        a.card:hover { border-color: var(--accent); }
        .card .icon { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
        .card h2 { font-size: 1rem; font-weight: 800; letter-spacing: 0; text-transform: none; color: var(--accent); border: 0; padding: 0; margin-bottom: 6px; }
        .card p { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }
        .card code { display: block; margin-top: 8px; padding: 6px; background: var(--accent-dim); font-size: 0.8rem; color: var(--accent); word-break: break-all; user-select: all; }
        .countdown { margin-top: 10px; font-size: 0.75rem; color: var(--warning); }
        .countdown.leer { color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <button type="button" class="lang-switch lang-switch-ecke" id="lang-switch">EN</button>
        <img class="launch-signet" src="/static/brand/lzm_signet_offwhite_tally.svg" alt="" height="64">
        <h1>LZ Media Station</h1>
        <p class="subtitle" id="sys-name"></p>
        <p class="ip">Adresse: <strong id="ip-addr"></strong></p>
        <div class="cards">
            <a href="/display" class="card card-present" id="card-present">
                <div class="icon">&#9654;</div>
                <h2>Pr&auml;sentation</h2>
                <p>Vollbild-Anzeige starten</p>
                <div class="countdown" id="countdown">Auto-Start in <span id="timer">15</span>s</div>
            </a>
            <a href="/admin" class="card card-config">
                <div class="icon">&#9881;</div>
                <h2>Konfiguration</h2>
                <p>Medien, Sensor &amp; Zonen einrichten</p>
            </a>
            <!-- ZWEI Adressen, nicht eine. Hier stand nur die Konfiguration,
                 und damit fehlte genau der Fall, den ein zweites Geraet am
                 haeufigsten hat: einen weiteren Schirm zeigen. Ein Tablet im
                 Foyer, ein Notebook an einem zweiten Aufbau, ein Handy zum
                 Kontrollieren -- alle drei holen dieselbe Anzeige, und
                 keiner von ihnen kann sie erraten, wenn sie hier nicht
                 steht. -->
            <div class="card card-remote">
                <div class="icon">&#128225;</div>
                <h2>Andere Ger&auml;te</h2>
                <p>Im selben Netz, Anzeige:</p>
                <code id="remote-display"></code>
                <p style="margin-top:8px">Konfiguration:</p>
                <code id="remote-url"></code>
            </div>
        </div>
    </div>
    <script src="/static/i18n-en.js"></script>
    <script src="/static/i18n.js"></script>
    <script>
        // Auto-Start nur wenn Medien konfiguriert sind
        var t = 15;
        var tmr = null;
        function stopCountdown() {
            if (tmr) { clearInterval(tmr); tmr = null; }
            var c = document.getElementById('countdown');
            if (c) c.style.display = 'none';
        }
        function startCountdown() {
            tmr = setInterval(function () {
                if (--t <= 0) { clearInterval(tmr); window.location.href = '/display'; }
                document.getElementById('timer').textContent = t;
            }, 1000);
        }
        document.addEventListener('click', function (e) {
            if (!e.target.closest('#card-present')) stopCountdown();
        });
        // ESC -> direkt zur Admin-Seite
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                stopCountdown();
                window.location.href = '/admin';
            }
        });
        fetch('/api/status').then(function (r) { return r.json(); }).then(function (d) {
            document.getElementById('sys-name').textContent = d.config.system_name || '';
            var hostIp = d.host_ip || location.hostname;
            var port = d.web_port || 5000;
            var hostStr = hostIp + (port === 80 ? '' : ':' + port);
            document.getElementById('ip-addr').textContent = hostStr;
            document.getElementById('remote-url').textContent = d.remote_url || ('http://' + hostStr + '/admin');
            document.getElementById('remote-display').textContent = d.display_url || ('http://' + hostStr + '/display');
            // Nur Auto-Start wenn near oder far Medien hat
            var n = d.config.near || {}, f = d.config.far || {};
            var hasMedia = (n.videos||[]).length || (n.images||[]).length || (n.audio||[]).length
                        || (f.videos||[]).length || (f.images||[]).length || (f.audio||[]).length;
            if (hasMedia) {
                startCountdown();
            } else {
                stopCountdown();
                var c = document.getElementById('countdown');
                if (c) { c.style.display = 'block'; c.classList.add('leer'); c.textContent = 'Keine Medien konfiguriert — bitte erst Konfiguration öffnen'; }
            }
        }).catch(function () {});
    </script>
</body>
</html>
